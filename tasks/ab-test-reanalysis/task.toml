schema_version = "1.4"
artifacts = [{ source = "/app", exclude = ["data", "__pycache__", ".venv"] }]

[task]
name = "diffuse-labs/ab-test-reanalysis"
description = "Re-analyse a disputed A/B readout before a launch decision: check the readout pipeline against the analysis plan, the data platform's documentation and the export, and fix it so that it gives the plan's readout on any export of this layout."
keywords = ["data-analysis", "ab-testing", "experimentation", "statistics", "audit"]

[metadata]
category = "data-analysis"
difficulty = "hard"

[agent]
timeout_sec = 3600.0
network_mode = "no-network"

[verifier]
environment_mode = "separate"
timeout_sec = 1000.0

[verifier.environment]
cpus = 1
memory_mb = 2048

[environment]
cpus = 2
memory_mb = 4096
